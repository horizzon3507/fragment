edition = "2024"
description = "Guess the song from a snippet that keeps growing — local music, terminal game"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
lofty = "0.25.5"
rand = "0.10.3"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strsim = "0.11.1"
thiserror = "2.0.21"
toml = "1.2.0"
unicode-normalization = "0.1.26"
walkdir = "2.5.0"
